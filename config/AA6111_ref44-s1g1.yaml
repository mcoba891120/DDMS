---
# AA6111
system:
  TASKname: 'template'
  alloy: "AA6111"
  conds: ["7min", "30min", "6hr", "168hr"]                            # corresponds to rls, ageing condition(s)
  rls: [93.0e-9, 140.0e-9, 298.0e-9, 307.0e-9]                        # corresponds to conds, average precipitates length from experiments (m)
  Ts: [298, 423, 473, 523]                                            # stretching temperature
  YS_exps:
    7min_298K: 290.59
    7min_423K: 243.79
    7min_473K: 202.34
    7min_523K: 155.73
    30min_298K: 256.55
    6hr_298K: 206.68
    168hr_298K: 160.77
  c_TEM: ["c_TEM_6111"]                                               # methods chose in TEM calculation, see _constitutive.py
  c_YS: ["c_G","c_prec_6111","c_ss_6111","c_gb","c_wh",
         "c_ssd_v1","c_gnd_v1","c_YS_temper"]                         # methods chose in YS calculation, see _constitutive.py
  c_PK: ["c_kinetics"]                                                # methods chose in PK calculation, see _constitutive.py

homogenization:
  SX:
    N_constituents: 1
    mechanical: 
      type: pass
      output: [dPdF]

phase:
  Aluminum:
    lattice: cF   # fcc
    mechanical:
      # output: [F, P, F_e, F_p, L_p, O]
      output: [F_e, F_p, P]
      elastic: {type: Hooke, C_11: 106.75e+9, C_12: 60.41e+9, C_44: 28.34e+9}
      plastic:
        type: phenopowerlaw
        N_sl: [12]                                        # slip systems
        a_sl: 2.25                                        # dummy
        atol_xi: 1.0                                      # max error to enter next iteration
        dot_gamma_0_sl: 0.001                             # reference shear strain rate for slip
        h_0_sl-sl: 75.0e+6                                # dummy
        h_sl-sl: [1.0, 1.4, 1.4, 1.4, 1.4, 1.4, 1.4]      # self/latent hardening factor
        n_sl: 100                                         # stress exponent term in shear rate (strain rate sensitivity)
        # output: [xi_sl,Nv,R_mean,f_all,Cbar,omega,
        #         pp,ss,gb,dd,tau_slip,rho_ssd,rho_gnd]   # output information
        output: [None]
        xi_0_sl: [136.09e+6]                              # tau0_slip, initial slip resistance (Pa)
        xi_inf_sl: [63.0e+6]                              # dummy
        # >----------------------------------------------------------------------------------------------------
        # global params 
        kinetics: stable                               # stable / nonstable precipitates consideration
        T: 298                                            # stretching temperature (K)
        rate : 0.001                                      # stretching rate
        rl: 93.0e-9                                       # average precipitates length from experiments (m)
        thickness : 101.0e-9                              # thickness of TEM image (m)
        tem_areas: [1.16550059e-13,1.16550059e-13,        # tem oberservation ares (m^-2)
                    1.16550059e-13,1.16550059e-13,
                    1.16550059e-13,1.16550059e-13,
                    1.16550059e-13,1.16550059e-13,
                    1.16550059e-13,1.16550059e-13,
                    1.16550059e-13,1.16550059e-13,
                    1.16550059e-13]                               
        # >----------------------------------------------------------------------------------------------------
        # c_G
        Tm : 923                                          # melt point
        theta : 2.295                                     # material constant
        u0 : 2.71e+10                                     # shear modulus (Pa)
        # >----------------------------------------------------------------------------------------------------
        # c_prec_6111
        b: 0.286e-9                                       # burgers vector (m) 
        rc: 2.2e-9                                        # fit, critical radius of Orowan particles (m)
        M: 2.35                                           # fit, taylor factor (reasonable value:2~3)
        beta: 0.24                                        # fit, a constant associated with the tension of a dislocation line
        # M: 2.6
        # beta: 0.36
        # >----------------------------------------------------------------------------------------------------
        # c_ss_6111
        wt: [97.57,0.61,0.76,0.8,0.14,0.12]               # Al Si Mg Cu Mn Fe
        aw: [26.982,28.085,24.305,63.546,54.938,55.845]   # atomic weight
        # >----------------------------------------------------------------------------------------------------
        # c_gb
        grainSize: 26.97e-6                               # grain size (m)
        # ky: 0.12                                        # Hall-Petch coefficient
        ky: 0.00
        # >----------------------------------------------------------------------------------------------------
        # c_YS_temper
        c1: 0.83                                          # constant, yield strength at RT
        RR: 8.314                                         # ideal gas constant (kJ/mol)
        DG: 300000                                        # Gibbs free energy (J)
        e0: 1.0e+6                                        # reference strain rate
        p: 1                                              # fit, determine the shape of short range barrier, 0~1
        q: 1                                              # fit, determine the shape of short range barrier, 1~2
        # p: 0.7
        # q: 1.6
        # >----------------------------------------------------------------------------------------------------
        # hardening law: ssd_v1 + gnd_v1
        alpha: 0.3                                       # (_)
        rho_ssd_0: [1.0e+1]                               # (m^-2)
        rho_gnd_0: [1.0e+1]                               # (m^-2)
        # c_ssd_v1
        k1: 4.0e+8                                       # SSD dislocation accumulation (m^-1), ~1.25e8
        # k1: 3.502639e+08
        k3: 2.0e+8                                        # calibrated on experiments (N/m^2 wt^3/4), ~4.7e7
        k20: 18                                           # reference dynamic recovery rate of SSD
        Crmg: 1.0
        Zs: 1.0e+5                                       # calibrated on experiments (s^-1)
        # Zs: 87653.958944
        m0: 3.0e-1                                       # (_)
        # c_gnd_v1
        k1g: 4.0e+8                                       # GND dislocation accumulation (m^-1)
        # k1g: 3.506158e+08
        k2g0: 20                                          # reference dynamic recovery rate of GND
        fr_o: 0.0109                                      # reference volume fraction of Orowan particles
        Zg: 1.0e+8                                        # calibrated on experiments (s^-1)
        # Zg: 8.765396e+07
        # c_gnd_v2
        ko: 47                                            # fit, (_), ~47
        ksat: 1.66e-3
        a_n: 2.5
        a_gnd: 0.0                                        # fit, (_), ~0.3
        # >----------------------------------------------------------------------------------------------------
        # damage
        omega0: 0.008
        omegac: 0.12
        q1: 0.667
        q2: 1.10
        # >----------------------------------------------------------------------------------------------------
        # precipitation kinetics
        Cp: 63.4                                          # Mg concentration in pure Mg2Si (wt%)
        A0: 16220                                         # chosen
        j0: 9.66e+34                                      # chosen
        Qd: 130000                                        # activation energy for diffusion (J/mol)
        D0: 9.0e-6                                        # H. Wu et al. High-throughput ab-initio dilute solute diffusion database
        Cs: 970                                           # pre-exponential term in expression for the solvus boundary (wt%)
        Qs: 47175                                         # apparent solvus boundary enthalpy (J/mol)
        sigma: 0.2                                        # interface energy
        Vm: 3.95e-5                                       # molar volume of precipitates (m^3/mol)
        classes: 1000
