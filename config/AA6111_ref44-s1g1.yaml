        r_max: 11.1362e-09                                # max radius (m)
        C0: 0.76                                          # initial Mg solute concentration in matrix (wt%)
        numerical_inc: 1.0e-10                            # to prevent inf/nan
        f_all: 0.0174                                     # volume fraction (_)
        R_mean: 1.78e-9                                   # particle mean radius (m)
