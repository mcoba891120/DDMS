[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ddms"
version = "0.1.0"
description = "Data Driven Multiscale Simulation (DDMS) - preprocessing/postprocessing tools for Abaqus and DAMASK crystal plasticity simulations"
authors = [{ name = "Kyle Chien" }]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "scikit-learn",
    "pyyaml",
    "tqdm",
    "damask",
    "orix",
    "matplotlib-scalebar",
    "intersect==1.2",
]

[project.optional-dependencies]
surrogate = [
    "torch",
    "torch_geometric",
    "mlflow",
    "wandb",
    "shap",
    "ranger21 @ git+https://github.com/lessw2020/Ranger21.git@1a96777278cdd14bc11afd865112724386d26a44",
]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
